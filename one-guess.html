<title>One Guess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column — header, clue board, answer row, keyboard. Nothing else. */
:root {
  --bg: #fbfbf9;
  --fg: #1a1a1b;
  --muted: #6e7073;
  --line: #d3d6da;
  --key: #e3e5e8;
  --green: #5f9e58;
  --yellow: #c6a93f;
  --grey: #7a7d80;
  --tile-fg: #ffffff;
  --overlay: rgba(251, 251, 249, 0.86);
  --font: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --mono: "Roboto Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121213; --fg: #f2f2f2; --muted: #9a9ca0; --line: #3a3a3c; --key: #818384;
    --green: #538d4e; --yellow: #b59f3b; --grey: #3a3a3c; --tile-fg: #ffffff;
    --overlay: rgba(18, 18, 19, 0.86); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121213; --fg: #f2f2f2; --muted: #9a9ca0; --line: #3a3a3c; --key: #818384;
  --green: #538d4e; --yellow: #b59f3b; --grey: #3a3a3c; --tile-fg: #ffffff;
  --overlay: rgba(18, 18, 19, 0.86); color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 500px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 14px; padding-block: 12px 10px;
}
header {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  border-bottom: 1px solid var(--line); padding-bottom: 10px;
}
.num { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
h1 { margin: 0; font-weight: 800; font-size: 24px; letter-spacing: -0.01em; text-align: center; }
.timer {
  justify-self: end; font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums;
}
.timer.done { color: var(--green); }
.hint { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
.hint b { color: var(--fg); }

.stage { position: relative; display: flex; justify-content: center; }
.board { display: grid; gap: 5px; width: min(100%, 290px); }
.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.tile {
  aspect-ratio: 1; max-width: 100%; display: grid; place-items: center;
  font-weight: 800; font-size: clamp(22px, 7vw, 30px); text-transform: uppercase;
  border: 2px solid var(--line); color: var(--fg); user-select: none;
}
.tile.g, .tile.y, .tile.x { border-color: transparent; color: var(--tile-fg); }
.tile.g { background: var(--green); }
.tile.y { background: var(--yellow); }
.tile.x { background: var(--grey); }
.tile.filled { border-color: var(--muted); animation: pop 0.1s; }
.guess { margin-top: 10px; }
.guess .tile { border-style: solid; }
.guess.shake { animation: shake 0.4s; }
.board.hidden .clue .tile { filter: blur(9px); }
.flip { animation: flip 0.45s ease both; }
@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }

.cover {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center;
  background: var(--overlay);
}
.cover p { margin: 0; max-width: 260px; font-size: 15px; line-height: 1.45; }
.btn {
  font: 600 16px var(--font); border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer;
  background: var(--fg); color: var(--bg);
}
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn:focus-visible, .key:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

.toast {
  position: fixed; left: 50%; top: calc(80px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); font-weight: 600; font-size: 14px;
  padding: 10px 14px; border-radius: 6px; pointer-events: none; z-index: 5;
}

.result { display: grid; gap: 12px; justify-items: center; text-align: center; }
.result .big { font-family: var(--mono); font-size: 40px; font-variant-numeric: tabular-nums; }
.result .sub { color: var(--muted); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.copybox { font-size: 13px; color: var(--muted); word-break: break-all; user-select: all; max-width: 100%; }

.keyboard { display: grid; gap: 8px; margin-top: auto; user-select: none; }
.krow { display: flex; gap: 6px; justify-content: center; }
.key {
  flex: 1 1 0; min-width: 0; height: 52px; border: 0; border-radius: 4px; cursor: pointer;
  background: var(--key); color: var(--fg); font: 600 14px var(--font); text-transform: uppercase;
  padding: 0;
}
.key.wide { flex: 1.5 1 0; font-size: 12px; }
.key.g { background: var(--green); color: var(--tile-fg); }
.key.y { background: var(--yellow); color: var(--tile-fg); }
.key.x { background: var(--grey); color: var(--tile-fg); }
.spacer { flex: 0.5 1 0; }
@media (prefers-reduced-motion: reduce) {
  .flip, .tile.filled, .guess.shake { animation: none; }
}
</style>

    </div>
    <div class="copybox" id="copybox" hidden></div>
  </div>

  <div class="keyboard" id="keyboard"></div>
</div>
<div class="toast" id="toast" hidden></div>

const VALID = new Set(WORDS.match(/.{5}/g));
const EPOCH = Date.UTC(2026, 9, 22);
const $ = (id) => document.getElementById(id);

function score(guess, answer) {
  const res = Array(5).fill("x"), left = {};
  for (let i = 0; i < 5; i++) {
    if (guess[i] === answer[i]) res[i] = "g";
    else left[answer[i]] = (left[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < 5; i++) {
    if (res[i] !== "g" && left[guess[i]] > 0) { res[i] = "y"; left[guess[i]]--; }
  }
  return res;
}

function pickIndex() {
  const m = /^#p(\d+)$/.exec(location.hash);
  if (m) { const n = +m[1] - 1; if (n >= 0 && n < PUZZLES.length) return n; }
  const day = Math.floor((Date.now() - EPOCH) / 864e5);
  return ((day % PUZZLES.length) + PUZZLES.length) % PUZZLES.length;
}

let idx, answer, clues, typed, startAt, timerId, misses, solved;

function load(i) {
  idx = i; [answer, ...clues] = PUZZLES[i];
  typed = ""; misses = 0; solved = false; startAt = null;
  clearInterval(timerId);
  $("num").textContent = "#" + (i + 1);
  $("timer").textContent = "0:00.0"; $("timer").classList.remove("done");
  $("result").hidden = true; $("copybox").hidden = true; $("coverCopy").hidden = true;
  $("keyboard").hidden = false; $("hint").hidden = false;
  $("cover").hidden = false; $("board").classList.add("hidden");
  renderBoard(); renderKeys();
  $("start").focus();
}

function renderBoard() {
  const b = $("board"); b.innerHTML = "";
  clues.forEach((w, r) => {
    const row = document.createElement("div"); row.className = "row clue";
    score(w, answer).forEach((c, k) => {
      const t = document.createElement("div");
      t.className = "tile " + c; t.textContent = w[k];
      t.style.animationDelay = (r * 60 + k * 40) + "ms";
      row.appendChild(t);
    });
    b.appendChild(row);
  });
  const g = document.createElement("div"); g.className = "row guess"; g.id = "guess";
  for (let k = 0; k < 5; k++) { const t = document.createElement("div"); t.className = "tile"; g.appendChild(t); }
  b.appendChild(g);
}

function keyState() {
  const st = {}, rank = { x: 1, y: 2, g: 3 };
  clues.forEach((w) => score(w, answer).forEach((c, k) => {
    if (!st[w[k]] || rank[c] > rank[st[w[k]]]) st[w[k]] = c;
  }));
  return st;
}

function renderKeys() {
  const kb = $("keyboard"), st = startAt === null ? {} : keyState(); kb.innerHTML = "";
  ["qwertyuiop", "asdfghjkl", "+zxcvbnm-"].forEach((r, ri) => {
    const row = document.createElement("div"); row.className = "krow";
    if (ri === 1) row.appendChild(Object.assign(document.createElement("div"), { className: "spacer" }));
    for (const ch of r) {
      const k = document.createElement("button"); k.className = "key"; k.type = "button";
      if (ch === "+") { k.textContent = "Enter"; k.classList.add("wide"); k.dataset.k = "Enter"; }
      else if (ch === "-") { k.textContent = "⌫"; k.classList.add("wide"); k.dataset.k = "Backspace"; k.setAttribute("aria-label", "Delete"); }
      else { k.textContent = ch; k.dataset.k = ch; if (st[ch]) k.classList.add(st[ch]); }
      row.appendChild(k);
    }
    if (ri === 1) row.appendChild(Object.assign(document.createElement("div"), { className: "spacer" }));
    kb.appendChild(row);
  });
}

function fmt(ms) {
  const s = ms / 1000, m = Math.floor(s / 60);
  return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0");
}

function start() {
  if (startAt !== null) return;
  $("cover").hidden = true;
  const b = $("board"); b.classList.remove("hidden");
  b.querySelectorAll(".clue .tile").forEach((t) => t.classList.add("flip"));
  startAt = performance.now();
  renderKeys();
  timerId = setInterval(() => { $("timer").textContent = fmt(performance.now() - startAt); }, 100);
}

function paintGuess() {
  [...$("guess").children].forEach((t, k) => {
    t.textContent = typed[k] || ""; t.classList.toggle("filled", !!typed[k]);
  });
}

let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 1400);
}

function reject(msg) {
  const g = $("guess"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake");
  toast(msg);
}

function submit() {
  if (typed.length < 5) return reject("Not enough letters");
  if (!VALID.has(typed)) return reject("Not in word list");
  if (typed !== answer) { misses++; typed = ""; reject("Not it. Keep going"); setTimeout(paintGuess, 400); return; }
  solved = true; clearInterval(timerId);
  const ms = performance.now() - startAt;
  $("timer").textContent = fmt(ms); $("timer").classList.add("done");
  [...$("guess").children].forEach((t, k) => {
    t.className = "tile g flip"; t.style.animationDelay = k * 80 + "ms";
  });
  $("final").textContent = fmt(ms);
  $("finalSub").textContent = "Solved #" + (idx + 1) + (misses ? " with " + misses + (misses === 1 ? " wrong guess" : " wrong guesses") : " first try");
  $("keyboard").hidden = true; $("hint").hidden = true; $("result").hidden = false;
  $("copyResult").dataset.text = "One Guess #" + (idx + 1) + ": " + fmt(ms) + (misses ? " (" + misses + " miss" + (misses === 1 ? "" : "es") + ")" : " 🟩") + "\nBeat me: " + link();
}

function link() { return SHARE_URL + "#p" + (idx + 1); }

function onKey(k) {
  if (startAt === null || solved) return;
  if (k === "Enter") submit();
  else if (k === "Backspace") { typed = typed.slice(0, -1); paintGuess(); }
  else if (/^[a-z]$/.test(k) && typed.length < 5) { typed += k; paintGuess(); }
}

async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label); }
  catch (e) { const c = $(startAt === null ? "coverCopy" : "copybox"); c.textContent = text; c.hidden = false; toast("Select the text below to copy"); }
}

$("start").addEventListener("click", start);
$("keyboard").addEventListener("click", (e) => { const k = e.target.closest(".key"); if (k) { onKey(k.dataset.k); k.blur(); } });
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (startAt === null && e.key === "Enter" && !$("cover").hidden) { e.preventDefault(); start(); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === "Enter" || k === "Backspace" || /^[a-z]$/.test(k)) { e.preventDefault(); onKey(k); }
});
$("copyResult").addEventListener("click", (e) => copy(e.currentTarget.dataset.text, "Result copied"));
$("raceLink").addEventListener("click", () => copy(link(), "Link copied. Send it, then press Start together"));
$("copyLink").addEventListener("click", () => copy(link(), "Link copied"));
$("newPuzzle").addEventListener("click", () => {
  let n; do { n = Math.floor(Math.random() * PUZZLES.length); } while (n === idx && PUZZLES.length > 1);
  load(n);
});
window.addEventListener("hashchange", () => load(pickIndex()));

load(pickIndex());
</script>
